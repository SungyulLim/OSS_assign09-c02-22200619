<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 관리</title>
</head>

<body>
    <h1>영화 관리 CRUD</h1>

    <a href="./index.html">HOME</a>
    <p>MockAPI에 저장된 영화 목록</p>

    <form id="movieForm">
        <div>
            <label for="title">영화 제목</label>
            <input id="title" type="text" required>
        </div>

        <div>
            <label for="director">감독</label>
            <input id="director" type="text" required>
        </div>

        <div>
            <label for="genre">장르</label>
            <input id="genre" type="text" required>
        </div>

        <div>
            <label for="country">국가</label>
            <input id="country" type="text" required>
        </div>

        <div>
            <label for="releaseDate">개봉일</label>
            <input id="releaseDate" type="date" required>
        </div>

        <button id="submitBtn" type="submit">영화 등록</button>
    </form>

    <button id="loadBtn" type="button">영화 목록 새로고침</button>
    <p id="status" role="status"></p>
    <ul id="movieList"></ul>

    <script>
        const API_URL = "https://6ae2c63cbbb54129229a60c6.mockapi.io/Movie";

        const loadButton = document.querySelector("#loadBtn");
        const statusElement = document.querySelector("#status");
        const movieList = document.querySelector("#movieList");
        const movieForm = document.querySelector("#movieForm");
        const submitButton = document.querySelector("#submitBtn");

        let movies = [];

        function render(items) {
            movieList.replaceChildren();

            items.forEach(movie => {
                const li = document.createElement("li");
                const title = document.createElement("h3");
                const details = document.createElement("p");
                const releaseDate = String(movie.releaseDate ?? "").slice(0, 10); // 날짜만 보여주게 만드는 방법 -> release date를 string으로 변환 후 날짜만 보여주게 만들기

                title.textContent = movie.title;
                details.textContent = `감독: ${movie.director} | ` + `장르: ${movie.genre} | ` + `국가: ${movie.country} | ` + `개봉일: ${releaseDate}`;

                li.appendChild(title);
                li.appendChild(details);
                movieList.appendChild(li);
            });
        }

        async function loadMovies() {
            loadButton.disabled = true;
            statusElement.textContent = "영화 목록을 가져오는 중...";

            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                movies = data;
                render(movies);

                statusElement.textContent = `${movies.length}개의 영화를 가져왔습니다.`;
            } catch (error) {
                statusElement.textContent = `영화 목록을 불러오지 못했습니다: ${error.message}`;
                console.error(error);
            } finally {
                loadButton.disabled = false;
            }
        }

        async function createMovies(e) {
            e.preventDefault();

            const title = document.querySelector("#title").value;
            const director = document.querySelector("#director").value;
            const genre = document.querySelector("#genre").value;
            const country = document.querySelector("#country").value;
            const releaseDate = document.querySelector("#releaseDate").value;

            const movieData = {
                title,
                director,
                genre,
                country,
                releaseDate,
                createdAt: new Date().toISOString()
            };

            submitButton.disabled = true;
            statusElement.textContent = "영화를 등록하는 중...";

            try {
                const response = await fetch("https://6ae2c63cbbb54129229a60c6.mockapi.io/Movie", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(movieData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                movieForm.reset();
                await loadMovies();
            } catch (error) {
                statusElement.textContent = `영화 등록 실패: ${error.message}`;
                console.error(error);
            } finally {
                submitButton.disabled = false;
            }
        }

        movieForm.addEventListener("submit", createMovies);
        loadButton.addEventListener("click", loadMovies);
        loadMovies();

    </script>
</body>


</html>
