<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 관리</title>
</head>

<body>
    <h1>영화 관리 CRUD</h1>

    <a href="./index.html">HOME</a>
    <p>MockAPI에 저장된 영화 목록</p>
    <hr>

    <h2> 검색 기능 </h2>
    <div>
        <label for="searchInput">영화 제목 검색</label>
        <input id="searchInput" type="search" placeholder="제목을 입력하세요">
    </div>
    <hr>

    <h2> 영화 추가 기능 </h2>
    <form id="movieForm">
        <div>
            <label for="title">영화 제목</label>
            <input id="title" type="text" required>
        </div>

        <div>
            <label for="director">감독</label>
            <input id="director" type="text" required>
        </div>

        <div>
            <label for="genre">장르</label>
            <input id="genre" type="text" required>
        </div>

        <div>
            <label for="country">국가</label>
            <input id="country" type="text" required>
        </div>

        <div>
            <label for="releaseDate">개봉일</label>
            <input id="releaseDate" type="date" required>
        </div>

        <button id="submitBtn" type="submit">영화 등록</button>
    </form>

    <button id="loadBtn" type="button">영화 목록 새로고침</button>
    <hr>

    <p id="status" role="status"></p>
    <ul id="movieList"></ul>

    <script>
        const API_URL = "https://6ae2c63cbbb54129229a60c6.mockapi.io/Movie";

        const loadButton = document.querySelector("#loadBtn");
        const statusElement = document.querySelector("#status");
        const movieList = document.querySelector("#movieList");
        const movieForm = document.querySelector("#movieForm");
        const submitButton = document.querySelector("#submitBtn");

        const searchInput = document.querySelector("#searchInput");

        let movies = [];
        let editingId = null;

        function render(items) {
            movieList.replaceChildren();

            items.forEach(movie => {
                const li = document.createElement("li");
                const title = document.createElement("h3");
                const details = document.createElement("p");
                const releaseDate = String(movie.releaseDate ?? "").slice(0, 10); // 날짜만 보여주게 만드는 방법 -> release date를 string으로 변환 후 날짜만 보여주게 만들기

                title.textContent = movie.title;
                details.textContent = `감독: ${movie.director} | ` + `장르: ${movie.genre} | ` + `국가: ${movie.country} | ` + `개봉일: ${releaseDate}`;

                const editButton = document.createElement("button");
                editButton.type = "button";
                editButton.textContent = "수정";

                editButton.addEventListener("click", () => {
                    startEdit(movie.id);
                });

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.textContent = "삭제";

                deleteButton.addEventListener("click", async () => {
                    if (submitButton.disabled) {
                        return;
                    }

                    if (!confirm(`"${movie.title}" 영화를 삭제하시겠습니까?`)) {
                        return;
                    }

                    deleteButton.disabled = true;
                    submitButton.disabled = true;
                    statusElement.textContent = "영화를 삭제하는 중...";

                    try {
                        await deleteMovie(movie.id);
                    } catch (error) {
                        statusElement.textContent = `영화 삭제 실패: ${error.message}`;
                        console.error(error);
                    } finally {
                        deleteButton.disabled = false;
                        submitButton.disabled = false;
                    }
                });

                li.appendChild(title);
                li.appendChild(details);
                li.appendChild(editButton);
                li.appendChild(deleteButton);
                movieList.appendChild(li);
            });
        }

        function searchMovies() {
            const keyword = searchInput.value.trim().toLowerCase();

            const filteredMovies = movies.filter(movie =>
                movie.title.toLowerCase().includes(keyword)
            );

            render(filteredMovies);
        }

        async function loadMovies() {
            loadButton.disabled = true;
            statusElement.textContent = "영화 목록을 가져오는 중...";

            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                movies = data;
                searchMovies();

                statusElement.textContent = `${movies.length}개의 영화를 가져왔습니다.`;
            } catch (error) {
                statusElement.textContent = `영화 목록을 불러오지 못했습니다: ${error.message}`;
                console.error(error);
            } finally {
                loadButton.disabled = false;
            }
        }

        async function createMovies(e) {
            e.preventDefault();

            const title = document.querySelector("#title").value;
            const director = document.querySelector("#director").value;
            const genre = document.querySelector("#genre").value;
            const country = document.querySelector("#country").value;
            const releaseDate = document.querySelector("#releaseDate").value;

            if (title.length < 2 || title.length > 100) {
                statusElement.textContent = "영화 제목은 2~100자로 입력하세요.";
                return;
            }

            if (director.length > 50) {
                statusElement.textContent = "감독 이름은 50자 이하로 입력하세요.";
                return;
            }

            const releaseYear = Number(releaseDate.split("-")[0]);

            if (!Number.isInteger(releaseYear) ||
                releaseYear < 1888 || releaseYear > 2026) {
                statusElement.textContent = "개봉 연도는 1888~2026년으로 입력하세요.";
                return;
            }

            if (editingId !== null) {
                submitButton.disabled = true;
                statusElement.textContent = "영화를 수정하는 중...";

                try {
                    await updateMovie(editingId, {
                        title,
                        director,
                        genre,
                        country,
                        releaseDate
                    });

                    movieForm.reset();
                    editingId = null;
                    submitButton.textContent = "영화 등록";
                } catch (error) {
                    statusElement.textContent = `영화 수정 실패: ${error.message}`;
                    console.error(error);
                } finally {
                    submitButton.disabled = false;
                }

                return;
            }
            const movieData = {
                title,
                director,
                genre,
                country,
                releaseDate,
                createdAt: new Date().toISOString()
            };

            submitButton.disabled = true;
            statusElement.textContent = "영화를 등록하는 중...";

            try {
                const response = await fetch("https://6ae2c63cbbb54129229a60c6.mockapi.io/Movie", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(movieData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                movieForm.reset();
                await loadMovies();
            } catch (error) {
                statusElement.textContent = `영화 등록 실패: ${error.message}`;
                console.error(error);
            } finally {
                submitButton.disabled = false;
            }
        }

        function startEdit(id) {
            if (submitButton.disabled) {
                return;
            }

            const movie = movies.find(item =>
                String(item.id) === String(id)
            );

            if (!movie) {
                statusElement.textContent = "수정할 영화를 찾을 수 없습니다.";
                return;
            }

            editingId = movie.id;

            document.querySelector("#title").value = movie.title;
            document.querySelector("#director").value = movie.director;
            document.querySelector("#genre").value = movie.genre;
            document.querySelector("#country").value = movie.country;

            document.querySelector("#releaseDate").value = String(movie.releaseDate ?? "").slice(0, 10);

            submitButton.textContent = "수정 저장";
            statusElement.textContent = `"${movie.title}" 수정 중입니다.`;
        }

        async function updateMovie(id, updatedData) {
            const response = await fetch(`${API_URL}/${id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(updatedData)
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            await loadMovies();
        }

        async function deleteMovie(id) {
            const response = await fetch(`${API_URL}/${id}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            await loadMovies();
        }

        movieForm.addEventListener("submit", createMovies);
        loadButton.addEventListener("click", loadMovies);
        searchInput.addEventListener("input", searchMovies);

        loadMovies();

    </script>
</body>


</html>
