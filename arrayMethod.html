    <script>
        // 배열 forEach
        const scores = [70, 80, 90];
        scores.forEach(score => {
            console.log(score);
        });

        const updated = scores.map(score => score + 5);

        console.log(updated);

        // function 실습
        function add(a, b) {
            return a + b;
        }

        const add2 = (a, b) => a + b;

        // JS Object
        const student = {
            name: "Alice",
            age: 20,

            introduce() {
                return `My name is ${this.name}`;
            }
        };
        
        console.log(student.name);
        console.log(student.introduce());
    </script>
